<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <!--
      GitHub Pages SPA fallback (the "spa-github-pages" trick).
      GitHub Pages serves this file for any unknown path (e.g. a refresh on
      /dashboard). It encodes the real path into a query string and redirects
      to the app root, where the inline script in index.html decodes it and
      restores the correct URL via history.replaceState BEFORE React Router
      mounts. Without this, direct links/refreshes on any route but "/" would
      404 on GitHub Pages, since it does not know about client-side routes.
    -->
    <script>
      // Default assumes a PROJECT page: https://username.github.io/repo-name/
      // If you deploy to a custom domain or a USER/ORG root page
      // (https://username.github.io/), change this to 0 and also change
      // VITE_BASE_PATH to '/' in the GitHub Actions workflow.
      var segmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
